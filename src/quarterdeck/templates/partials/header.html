<div class="header-content">
    <span class="header-date">
        {{ now.strftime('%a %d %b') }}
    </span>

    <span class="header-weather">
        {% if weather.data %}
            {{ weather.data.current_temp_c | int }}°C {{ weather.data.current_emoji }} {{ weather.data.current_description }}
        {% elif weather.error %}
            <span class="error-text">Weather unavailable</span>
        {% endif %}
    </span>

    <span id="clock" class="header-clock">--:--</span>
</div>
